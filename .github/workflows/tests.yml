name: Python tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Diagnostic: new small OCR tests only
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests/test_small_region_ocr.py
      - name: Diagnostic: existing tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q --ignore=tests/test_small_region_ocr.py
