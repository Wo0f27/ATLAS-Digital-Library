[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-digital-library"
version = "0.2.0"
description = "Offline-first native digital bookshelf for Windows"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PySide6>=6.10,<7",
  "pypdfium2>=5,<6",
  "Pillow>=11,<13",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
atlas-library = "atlas_library.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
